# Traefik Load Balancer — multiple replicas with health checks
#
# Traefik automatically load-balances across all healthy containers
# that share the same service label.
#
# Usage:
#   docker network create traefik-network
#   docker-compose -f docker-compose-loadbalancer.yml up -d --scale api=3
#
# Scale at runtime:
#   docker-compose -f docker-compose-loadbalancer.yml up -d --scale api=5

version: "3"

services:
  traefik:
    image: traefik:v3.0
    container_name: traefik
    restart: unless-stopped
    ports:
      - "80:80"
      - "8080:8080"
    command:
      - "--api.dashboard=true"
      - "--api.insecure=true"
      - "--providers.docker=true"
      - "--providers.docker.exposedbydefault=false"
      - "--providers.docker.network=traefik-network"
      - "--entrypoints.web.address=:80"
      - "--log.level=INFO"
      - "--accesslog=true"
      # Expose Prometheus metrics
      - "--metrics.prometheus=true"
      - "--metrics.prometheus.addentrypointslabels=true"
      - "--metrics.prometheus.addserviceslabels=true"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    networks:
      - traefik-network

  api:
    image: nginx:alpine # replace with your service image
    restart: unless-stopped
    # Traefik discovers all replicas automatically — no port mapping needed
    labels:
      - "traefik.enable=true"
      # Route all requests for api.localhost to this service
      - "traefik.http.routers.api.rule=Host(`api.localhost`)"
      - "traefik.http.routers.api.entrypoints=web"
      - "traefik.http.services.api.loadbalancer.server.port=80"
      # Load-balancing strategy: wrr (weighted round-robin, default) | drr (dynamic)
      - "traefik.http.services.api.loadbalancer.passhostheader=true"
      # Sticky sessions — comment out if not needed
      - "traefik.http.services.api.loadbalancer.sticky.cookie=true"
      - "traefik.http.services.api.loadbalancer.sticky.cookie.name=lb_sticky"
      - "traefik.http.services.api.loadbalancer.sticky.cookie.httponly=true"
      # Health check — Traefik removes unhealthy containers from rotation
      - "traefik.http.services.api.loadbalancer.healthcheck.path=/healthz"
      - "traefik.http.services.api.loadbalancer.healthcheck.interval=10s"
      - "traefik.http.services.api.loadbalancer.healthcheck.timeout=3s"
    networks:
      - traefik-network

  # Circuit breaker + retry middleware example
  api-resilient:
    image: nginx:alpine
    restart: unless-stopped
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.api-resilient.rule=Host(`resilient.localhost`)"
      - "traefik.http.routers.api-resilient.entrypoints=web"
      - "traefik.http.routers.api-resilient.middlewares=retry,circuitbreaker"
      - "traefik.http.services.api-resilient.loadbalancer.server.port=80"
      # Retry failed requests up to 4 times
      - "traefik.http.middlewares.retry.retry.attempts=4"
      - "traefik.http.middlewares.retry.retry.initialinterval=100ms"
      # Circuit breaker: open if >30% of requests fail
      - "traefik.http.middlewares.circuitbreaker.circuitbreaker.expression=NetworkErrorRatio() > 0.30 || ResponseCodeRatio(500, 600, 0, 600) > 0.30"
    networks:
      - traefik-network

networks:
  traefik-network:
    external: true
