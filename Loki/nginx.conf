events {}
http {
    server {
        listen 8080;
        server_name _;

        # Redirect all HTTP to HTTPS
        return 301 https://$host:8443$request_uri;
    }

    server {
        listen 8443 ssl;
        server_name _;

        ssl_certificate /etc/nginx/certs/loki.crt;
        ssl_certificate_key /etc/nginx/certs/loki.key;
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_ciphers HIGH:!aNULL:!MD5;

        # Basic Auth
        auth_basic "Loki Auth";
        auth_basic_user_file /etc/nginx/.htpasswd;

        location / {
            proxy_pass http://loki:3100;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
    }
}

# Place self-signed certs in ./certs/loki.crt and ./certs/loki.key and mount to /etc/nginx/certs in docker-compose.
