# Envoy Prometheus Metrics Config
#
# This file configures Envoy to expose Prometheus-compatible stats.
# The /stats/prometheus endpoint is available on the admin interface.
#
# Usage:
#   envoy --config-path envoy-prometheus.yaml
#
# Scrape from Prometheus:
#   - job_name: 'envoy'
#     static_configs:
#       - targets: ['localhost:9901']
#     metrics_path: /stats/prometheus

static_resources:
  listeners:
    - name: main_listener
      address:
        socket_address:
          address: 0.0.0.0
          port_value: 10000
      filter_chains:
        - filters:
            - name: envoy.filters.network.http_connection_manager
              typed_config:
                "@type": type.googleapis.com/envoy.extensions.filters.network.http_connection_manager.v3.HttpConnectionManager
                stat_prefix: ingress_http
                generate_request_id: true

                # Detailed stats for each route
                route_config:
                  name: local_route
                  virtual_hosts:
                    - name: backend
                      domains: ["*"]
                      routes:
                        - match:
                            prefix: /
                          route:
                            cluster: backend_cluster
                            # Per-route stats tags
                          typed_per_filter_config:
                            envoy.filters.http.router:
                              "@type": type.googleapis.com/envoy.extensions.filters.http.router.v3.Router
                              # emit_dynamic_metadata enables downstream metric correlation
                              emit_dynamic_metadata: true

                http_filters:
                  - name: envoy.filters.http.router
                    typed_config:
                      "@type": type.googleapis.com/envoy.extensions.filters.http.router.v3.Router

  clusters:
    - name: backend_cluster
      connect_timeout: 0.5s
      type: LOGICAL_DNS
      lb_policy: ROUND_ROBIN
      load_assignment:
        cluster_name: backend_cluster
        endpoints:
          - lb_endpoints:
              - endpoint:
                  address:
                    socket_address:
                      address: service.example.com
                      port_value: 8080

# Admin interface — exposes /stats/prometheus for scraping
admin:
  address:
    socket_address:
      address: 0.0.0.0
      port_value: 9901

# Stats configuration: enable Prometheus sink and custom tag extraction
stats_config:
  stats_tags:
    # Extract cluster name as a Prometheus label
    - tag_name: cluster_name
      regex: "^cluster\\.((.+?)\\.).*$"
    # Extract listener name as a Prometheus label
    - tag_name: listener_address
      regex: "^listener\\.(((?:[_.[:digit:]]*|\\[.*\\])\\.[0-9]+)\\.)"
    # Extract virtual host name
    - tag_name: virtual_host
      regex: "^vhost\\.((.+?)\\.)"
    # Extract HTTP response code
    - tag_name: response_code
      regex: "_rq(_(\\.0|(\\d{3})))$"
    # Extract gRPC response status
    - tag_name: grpc_response_status
      regex: "^grpc-web\\.(grpc_status_(\\d+))"

  # Use all default stat tags in addition to the custom ones above
  use_all_default_tags: true

  # Publish stats to stdout for debugging (remove in production)
  stats_matcher:
    inclusion_list:
      patterns:
        - prefix: cluster.
        - prefix: listener.
        - prefix: http.
        - prefix: server.
        - prefix: runtime.
