apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: projects-bootstrap
  namespace: argocd
  finalizers:
  - resources-finalizer.argocd.argoproj.io
spec:
  project: platform-core
  source:
    repoURL: https://github.com/shubhamsugara22/Kleptic-tools
    targetRevision: main
    path: argo/platform/day1/projects
    directory:
      recurse: false
      include: '*.yaml'
  destination:
    server: https://kubernetes.default.svc
    namespace: argocd
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
