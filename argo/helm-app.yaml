# Helm Chart ArgoCD Application Template
# Deploy applications using Helm charts

apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: nginx-ingress
  namespace: argocd
  finalizers:
  - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  
  source:
    # Helm repository URL
    repoURL: https://kubernetes.github.io/ingress-nginx
    
    # Chart name
    chart: ingress-nginx
    
    # Chart version
    targetRevision: 4.7.1
    
    helm:
      # Release name (optional, defaults to app name)
      releaseName: nginx-ingress
      
      # Values files from the repo (optional)
      valueFiles:
      - values-production.yaml
      
      # Override specific values
      parameters:
      - name: controller.replicaCount
        value: "3"
      - name: controller.service.type
        value: LoadBalancer
      - name: controller.metrics.enabled
        value: "true"
      
      # Raw values (alternative to parameters)
      values: |
        controller:
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
          nodeSelector:
            node-type: ingress
      
      # Skip CRD installation
      skipCrds: false
      
      # Pass credentials from argocd-secret
      passCredentials: false
  
  destination:
    server: https://kubernetes.default.svc
    namespace: ingress-nginx
  
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
    - CreateNamespace=true
    - ServerSideApply=true
